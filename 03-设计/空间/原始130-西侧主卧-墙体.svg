    <text x="65" y="810">1. 按 `02-户型与量尺/CAD/【建施】1#楼.pdf` 偶数层 130 户型西侧描墙；黑块为图上黑墙/柱位置。</text>
    <text x="65" y="824">2. 房间尺寸按图上净面积+轴网反推（7.80=2600×3000 可对上）；墙厚、门洞位置为示意，施工以 CAD/DWG 为准。</text>
    <text x="65" y="838">3. 西侧主卧区 = 卧室 6.38 + 书房 6.60 + 衣帽间 3.91；改造后对应主卧套（27.34）的一部分，非最终尺寸。</text>
