    <text x="375" y="520" text-anchor="middle" font-size="10">餐厅</text>
    <text x="491" y="520" text-anchor="middle" font-size="10">厨房</text>
    <text x="491" y="533" text-anchor="middle" font-size="7" fill="#6b7280">1990×3150</text>
    <text x="585" y="520" text-anchor="middle" font-size="9">北次卫</text>
