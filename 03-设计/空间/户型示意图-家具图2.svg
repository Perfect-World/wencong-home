  <!-- notes -->
  <g font-size="10" fill="#4b5563">
    <text x="70" y="650" font-weight="700" fill="#1f2937">关键取舍</text>
    <text x="70" y="668">• 客厅/书房开放：黑皮电动沙发 3m 朝东；85 寸移动电视在客厅东侧；书房 2.4m 黑胡桃木独板桌 + 两把人体工学椅；书房西侧整排到顶白色平板门柜。</text>
    <text x="70" y="686">• 厨房：烟道 460×520；冰箱 833×600 在烟道东侧、门朝东、南侧齐烟道、裸露；AK7 灶 800×450×135；灶-冰箱 500、水槽侧约 420；通道 930（详见厨房大样）。</text>
    <text x="70" y="704">• 餐厅：北侧落地窗；东墙餐边柜 450 深，不放冰箱；餐桌留 ≥900，不挡北窗/入口。</text>
    <text x="70" y="722">• 阳台：与客厅一体、落地窗；窗帘装在阳台窗；东侧洗烘、西侧晾晒；储物间南侧放中央空调外机。</text>
    <text x="70" y="740">• 南次卧 + 南次卫为套内套房（原公共门封堵）；主卧套 = 主卧 + 主卫 + 衣帽间；北次卫用蹲便器。</text>
    <text x="70" y="758">• 入户：东侧门斗 → 玄关/过道，过道两侧为客厅/餐厅；入户不经过餐厅；鞋柜/换鞋凳在电梯厅。</text>
    <text x="70" y="776">• 图面方向：上=南、下=北、右=西、左=东；原图 N 箭头不要直接使用；所有尺寸施工前现场复尺。</text>
    <text x="70" y="794" fill="#9ca3af">示意不按比例；家具仅表达位置关系；厨房/主卫/北次卫细部以对应大样为准。</text>
  </g>
</svg>
