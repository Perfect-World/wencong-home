    <text x="540" y="225" text-anchor="middle" font-size="9" fill="#6b7280">73.78㎡</text>
    <text x="500" y="335" text-anchor="middle" font-size="10">客厅</text>
    <text x="720" y="205" text-anchor="middle" font-size="10">书房</text>
    <text x="400" y="577" text-anchor="middle" font-size="10">餐厅</text>
    <text x="488" y="540" text-anchor="middle" font-size="10">厨房</text>
    <text x="488" y="552" text-anchor="middle" font-size="7" fill="#6b7280">1990×3150</text>
    <text x="600" y="576" text-anchor="middle" font-size="9">北次卫</text>
    <text x="727" y="496" text-anchor="middle" font-size="10">北次卧</text>
