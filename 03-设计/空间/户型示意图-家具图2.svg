    <text x="855" y="140" text-anchor="middle" font-size="12">主卧</text>
    <text x="855" y="153" text-anchor="middle" font-size="9" fill="#6b7280">27.34㎡（套）</text>
    <text x="967" y="210" text-anchor="middle" font-size="9">主卫</text>
    <text x="967" y="221" text-anchor="middle" font-size="7" fill="#6b7280">4.57㎡</text>
